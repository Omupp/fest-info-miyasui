<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iTLFest.2026 タイムテーブルとパンフ（非公式まとめサイト）</title>
<meta name="description" content="iTLFest.2026（中央大学 市ヶ谷田町キャンパス・10/31〜11/1）の企画を、タイムテーブルとパンフの形にまとめた非公式のページです。">
<meta property="og:title" content="iTLFest.2026 タイムテーブルとパンフ（非公式まとめサイト）">
<meta property="og:description" content="10/31（土）・11/1（日）の企画を時間と場所で見られます。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>
<header class="site">
  <p class="eyebrow">非公式まとめサイト<span class="sepbar" aria-hidden="true">｜</span><a href="https://itlfest.com/" target="_blank" rel="noopener">公式サイトはこちら</a></p>
  <h1>iTLFest.2026</h1>
  <p class="site-sub" id="site-sub"></p>
</header>

<div class="bar">
  <nav class="seg tabs" aria-label="表示の切り替え">
    <a href="#time" data-tab="time">タイムテーブル</a>
    <a href="#pamph" data-tab="pamph">パンフ</a>
  </nav>
</div>

<main>
  <section id="view-time" hidden>
    <div class="seg" role="group" aria-label="日付" id="tt-days"></div>
    <div id="nowbox"></div>
    <h2 class="sec">時間が決まっている企画</h2>
    <p class="tt-hint" id="tt-hint" hidden>左右にずらすと、ほかの教室も見られます</p>
    <div class="tt-card card">
      <div class="tt-headrow" aria-hidden="true"><div class="tt-axishead"></div><div class="tt-headview"><div class="tt-headinner" id="tt-heads"></div></div></div>
      <div class="tt-wrap" id="tt-wrap"><div class="tt" id="tt"></div></div>
    </div>
    <h2 class="sec" id="allday-head">終日</h2>
    <div class="dir" id="allday"></div>
  </section>

  <section id="view-pamph" hidden>
    <div class="seg" role="group" aria-label="日付" id="pf-days"></div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="企画名・団体・教室でさがす" aria-label="企画をさがす" autocomplete="off" enterkeyhint="search">
    </label>
    <nav class="floor-nav" id="floor-nav" aria-label="階"></nav>
    <div id="floors"></div>
    <p class="empty" id="empty" hidden>見つかりません</p>
    <h2 class="sec">ご案内</h2>
    <div class="card"><table class="ledger" id="info"></table></div>
    <h2 class="sec">団体</h2>
    <div class="card" id="orgs"></div>
  </section>
</main>

<footer class="site" id="foot"></footer>

<dialog id="detail">
  <div class="dlg-bar"><button type="button" id="dlg-close">閉じる</button></div>
  <div id="dlg-body" tabindex="-1"></div>
</dialog>

<script src="app.js?v=25"></script>
</body>
</html>
