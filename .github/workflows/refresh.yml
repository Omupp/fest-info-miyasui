# 学祭ポータルを 1 時間おきに読み直し、企画の中身が変わっていたら data/fest.json を更新する。
# 学祭が終わった次の日（11/2）を過ぎたら何もしない。
name: refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 学祭が終わっていたら止める
        id: gate
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" -gt 20261102 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != '1'

      - name: 取り込む
        if: steps.gate.outputs.skip != '1'
        run: python3 tools/scrape.py

      - name: 変わっていたら commit
        if: steps.gate.outputs.skip != '1'
        run: |
          if git diff --quiet -- data/fest.json; then
            echo "変化なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fest.json
          git commit -m "学祭ポータルの更新を取り込む"
          git push
